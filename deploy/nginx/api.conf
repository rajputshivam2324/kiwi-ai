# API + deploy webhook
# Domain: api.kiwiai.shivamio.in

server {
  listen 80;
  server_name api.kiwiai.shivamio.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.kiwiai.shivamio.in;

  ssl_certificate /etc/letsencrypt/live/api.kiwiai.shivamio.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.kiwiai.shivamio.in/privkey.pem;

  client_max_body_size 25m;

  # GitHub Actions auto-deploy webhook (authenticated via X-Deploy-Token)
  location = /deploy {
    proxy_pass http://127.0.0.1:8787/deploy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Deploy-Token $http_x_deploy_token;
    # A cold `docker compose pull` of a fresh image set can exceed 300s and
    # would surface to CI as an unexplained 504 rather than the webhook's error.
    proxy_read_timeout 600;
    proxy_send_timeout 600;
  }

  # Deploy preflight — reports config problems without triggering a deploy.
  location = /deploy-health {
    proxy_pass http://127.0.0.1:8787/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Deploy-Token $http_x_deploy_token;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeouts for SSE (builder stream, chat stream)
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    proxy_pass http://127.0.0.1:8000;
  }
}
