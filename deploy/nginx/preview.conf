# Live Vite preview (fixed port 5200 when BUILDER_MAX_LIVE_PREVIEWS=1)
# Domain: preview.kiwiai.shivamio.in

server {
  listen 80;
  server_name preview.kiwiai.shivamio.in;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name preview.kiwiai.shivamio.in;

  ssl_certificate /etc/letsencrypt/live/preview.kiwiai.shivamio.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.kiwiai.shivamio.in/privkey.pem;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    proxy_pass http://127.0.0.1:5200;
  }
}
