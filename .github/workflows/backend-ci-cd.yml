name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      # deploy/ holds host-side assets (webhook, compose, nginx). The webhook
      # syncs them from git, so a change here must trigger a deploy too.
      - "deploy/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

# Needed so the docker job can push to GHCR with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LANGFUSE_ENABLED: "false"
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          pip check

      - name: Cache tokenizer vocabulary
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"

      - name: Run evals
        env:
          PYTHONPATH: .
        run: pytest evals -q -m "not integration"

  docker:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kiwi-ai-backend
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger backend deploy
    runs-on: ubuntu-latest
    needs: docker
    # Also allow a manual run, so a deploy can be retried from the Actions tab
    # without pushing an empty commit.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Call deploy webhook
        env:
          DEPLOY_URL: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}
          DEPLOY_SECRET: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${DEPLOY_URL}" ]; then
            echo "BACKEND_DEPLOY_WEBHOOK_URL not set — skipping auto-deploy."
            echo "Image was still published to GHCR. Pull manually on EC2 if needed."
            exit 0
          fi

          # Do NOT use `curl -f`: it discards the response body, which is the
          # only place the webhook can explain *why* a deploy failed.
          auth=()
          if [ -n "${DEPLOY_SECRET}" ]; then
            auth=(-H "X-Deploy-Token: ${DEPLOY_SECRET}")
          fi

          status=0
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt ${attempt}"
            status=$(curl -sS -X POST "${auth[@]}" \
              --max-time 600 \
              -o /tmp/deploy-response.txt \
              -w '%{http_code}' \
              "${DEPLOY_URL}") || status="000"

            echo "HTTP ${status}"
            echo "Response:"
            cat /tmp/deploy-response.txt 2>/dev/null || echo "(empty)"
            echo ""
            echo "::endgroup::"

            if [ "${status}" = "200" ]; then
              echo "Deploy succeeded."
              exit 0
            fi

            # Config and auth problems will not fix themselves — fail fast.
            case "${status}" in
              400|401|403|404) break ;;
            esac

            if [ "${attempt}" -lt 3 ]; then
              echo "Retrying in 20s..."
              sleep 20
            fi
          done

          echo "::error title=Backend deploy failed::Webhook returned HTTP ${status}. See the response body above for the failing step and hint."
          exit 1
